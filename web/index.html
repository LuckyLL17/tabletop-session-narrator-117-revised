<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌游局势与战报工作台</title><link rel="stylesheet" href="/styles.css"></head><body><header><p class="kicker">TABLETOP / SESSION NARRATOR</p><h1>把一局桌游，留下它的转折。</h1><p>记录回合、行动、资源与关键时刻，结束后生成一份真正能复盘的战报。</p></header><main><section id="auth" class="panel"><h2>进入工作台</h2><form id="auth-form"><input name="email" type="email" placeholder="邮箱" required><input name="name" placeholder="昵称（注册时填写）"><input name="password" type="password" placeholder="密码" required><button>注册 / 登录</button></form></section><section id="workspace" hidden><div class="toolbar"><div><span class="kicker">LIVE DESK</span><h2 id="welcome">我的对局</h2></div><button id="logout" class="quiet">退出</button></div><div class="grid"><article class="panel"><h3>新建桌游档案</h3><form id="game-form"><input name="name" placeholder="桌游名称" required><textarea name="summary" placeholder="这款桌游的玩法摘要"></textarea><div class="row"><input name="min_players" type="number" min="1" value="2"><input name="max_players" type="number" min="1" value="4"></div><button>保存档案</button></form><div id="games" class="stack"></div></article><article class="panel"><h3>建立新对局</h3><form id="match-form"><select name="game_id" id="game-select" required></select><input name="name" placeholder="今晚的对局名称" required><textarea name="players" placeholder="玩家名称，用逗号分隔" required></textarea><button>创建对局</button></form><div id="matches" class="stack"></div></article></div><section id="match-desk" class="panel" hidden><div class="toolbar"><div><span class="kicker">CURRENT MATCH</span><h2 id="match-title"></h2><p id="match-status"></p></div><div id="status-actions" class="row"></div></div><div class="grid"><article><h3>回合推进</h3><form id="turn-form"><input name="focus" placeholder="本回合关注什么？"><button>开启下一回合</button></form><div id="turns" class="stack"></div></article><article><h3>记录行动</h3><form id="event-form"><select name="seat_id" id="seat-select"></select><select name="kind"><option value="行动">行动</option><option value="资源变化">资源变化</option><option value="关键时刻">关键时刻</option><option value="旁白">旁白</option></select><input name="label" placeholder="行动名称" required><input name="score_delta" type="number" value="0"><input name="weight" type="number" min="1" max="10" value="5"><textarea name="detail" placeholder="补充细节"></textarea><button>写入时间线</button></form></article></div><div class="grid"><article><h3>时间线重放</h3><div id="timeline" class="stack"></div></article><article><h3>战报</h3><div id="report"></div><button id="download">导出 Markdown</button></article></div></section><p id="notice"></p></section></main><script src="/app.js"></script></body></html>
